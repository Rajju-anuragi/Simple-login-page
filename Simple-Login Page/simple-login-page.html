<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="simple-login.css">
    <title>Simple login page</title>
</head>

<body>
    <div class="container">
        <div class="form">
            <h1>Registration Form</h1>
            <div class="label">
                <br>
                <label> First Name :</label>
                <br>
                <input type="name" name="name" class="name" placeholder="Enter your First Name" required>
                <br>
                <br>
                <label>Last Name :</label>
                <br>
                <input type="name" class="name" placeholder="Enter Your Last Name"  required>
                <br>
                <br>
                <label>Mob No :</label>
                <br>
                <input type="number" class="name phone " placeholder="Enter Your Mob"  required>
                <br>
                  <br>
                <label>Gmail :</label>
                <br>
                <input type="email" class="name email" placeholder="Enter Your Email"  required>
                <br>
                  <br>
                <label>Password:</label>
                <br>
                <input type="password" class="name pass" placeholder="Enter Your password"  required>
                <br> 
                 <br>
                <label>Confirm Password :</label>
                <br>
                <input type="password" class="name pass" placeholder=" Re-Enter Your Password "  required>
                <br>
                  <br>
            </div>
        </div>
        
        <button type="button" class="btn">Submit Form</button>
    </div>


</body>

</html>
